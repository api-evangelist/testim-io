aid: testim-io
name: Testim Io
description: >-
  Testim is an AI-powered functional test automation platform for web and mobile
  applications, using machine learning to author, run, and self-heal UI tests.
  Acquired by Tricentis in 2022, Testim is offered as part of the Tricentis
  quality-engineering portfolio. It exposes a public REST API (api.testim.io,
  with an EU host at api.eu.testim.io) and an official npm CLI
  (@testim/testim-cli) so teams can manage test branches; look up and execute
  tests, suites, labels and test plans from CI/CD; read execution and step-level
  results; and manage mobile application binaries. Testim was backed by
  Lightspeed Venture Partners prior to acquisition.
